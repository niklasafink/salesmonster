# Hourly tick for the mail sequences, 4–21 h UTC (6–23 h Berlin); nothing goes out at night
name: Strecken
on:
  schedule:
    - cron: "7 4-21 * * *"
  workflow_dispatch:
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Strecken ausführen
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS --max-time 300 -H "Authorization: Bearer $CRON_SECRET" https://sales-portal-sooty.vercel.app/api/cron/sequences
