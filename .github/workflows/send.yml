# The only send tick: hourly 4–21 h UTC (6–23 h Berlin), each tenant sends its share inside its own send window
name: Versand
on:
  schedule:
    - cron: "37 4-21 * * *"
  workflow_dispatch:
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Fällige Mails senden
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS --max-time 300 -H "Authorization: Bearer $CRON_SECRET" https://sales-portal-sooty.vercel.app/api/cron/send
